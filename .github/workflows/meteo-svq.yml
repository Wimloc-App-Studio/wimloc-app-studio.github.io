name: Données météo Séville aéroport

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meteo-svq.yml"
      - "meteo/fetch_svq.py"

permissions:
  contents: write

concurrency:
  group: meteo-svq
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données (METAR + Meteostat)
        run: python3 meteo/fetch_svq.py /tmp/out
      - name: Publier sur la branche meteo-data
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/out
          git init -q -b meteo-data
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Données SVQ $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" meteo-data
