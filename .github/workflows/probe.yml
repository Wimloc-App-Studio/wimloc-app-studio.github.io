name: probe
on: {push: {branches: [probe]}}
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe.py /tmp/o
      - run: |
          cd /tmp/o && git init -q -b probe-out && git config user.name bot && git config user.email b@b && git add -A && git commit -qm o
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" probe-out
